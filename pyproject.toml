[project]
name = "yheart"
dynamic = ["version"]
description = "Automated yellow-heart region segmentation, multidimensional color-space feature extraction, and quantitative grading (Comprehensive Yellow Score, CYS) for Chinese cabbage phenotyping."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{name = "Yiwu Ouyang", email = "98174759+ou6326@users.noreply.github.com"}, { name = "ZhaoXinCAAS" }]
keywords = [
    "Chinese cabbage",
    "yellow-heart",
    "phenotyping",
    "color space",
    "GMM",
    "broad-sense heritability",
    "plant phenomics",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "pandera>=0.33",
]

[project.optional-dependencies]
# Optional: SAM 3 / ONNX-based batch segmentation via X-AnyLabeling companion tools.
sam = ["onnx", "onnxruntime"]
# Optional: Jupyter notebook exploration environment.
notebook = ["ipykernel", "jupyter"]
# Development tooling (type stubs included so checkers see precise third-party
# types, same as the pygapit project).
dev = [
    "pytest",
    "ruff",
    "pyrefly",
    "basedpyright",
    "pandas-stubs>=3.0",
    "scipy-stubs>=1.18",
    "types-seaborn",
]

[project.scripts]
crop-heads = "yheart.imaging.crop_heads:main"
segment-yellow-heart = "yheart.imaging.segment_yellow_heart:main"
extract-color-features = "yheart.imaging.extract_color_features:main"
minmax-normalize = "yheart.scoring.normalize_minmax:main"
fisher-scores = "yheart.scoring.fisher_scores:main"
baseline-compare = "yheart.scoring.baseline_compare:main"
color-calibrate = "yheart.imaging.color_calibrate:main"
robustness-test = "yheart.scoring.robustness_test:main"
validate-thresholds = "yheart.scoring.validate_thresholds:main"
validate-metadata = "yheart.imaging.validate_metadata:main"
gmm-cys = "yheart.scoring.gmm_grading:main"
broad-heritability = "yheart.genetics.heritability:main"
cys-compute = "yheart.scoring.cys_compute:main"
evaluate-segmentation = "yheart.imaging.evaluate_segmentation:main"
gwas = "yheart.genetics.gwas:main"
manhattan-plot = "yheart.genetics.manhattan_plot:main"
annotate-genes = "yheart.genetics.annotate_genes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/yheart/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/yheart"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Keep lint focused on real bugs; tolerate deliberately-permissive patterns
# used in this research CLI (broad exception capture with user-facing print,
# matplotlib/kwargs dict() calls, cosmetic int() wrapping).
[tool.ruff.lint]
ignore = [
    "BLE001", # blind except: CLI scripts intentionally catch+report errors
    "UP037", # quoted annotations: pandas Series is not subscriptable at runtime
]
select = [
    "E501",
]

[tool.ruff.format]
preview = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-q"

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
python-version = "3.12"

[tool.pyrefly.errors]
# Third-party (NumPy/pandas/OpenCV/argparse/pytest) APIs are intentionally
# dynamic; argument/variable Unknowns from those boundaries are accepted.
# Everything annotation-related stays fully enabled: every def in src/ and
# tests/ carries complete annotations (verified by removing each switch).
unknown-argument-type = false
unknown-variable-type = false
# Discarded results are idiomatic here (argparse builder chains, plot calls).
unused-call-result = false
# Truthiness on sized/numeric values (`if not records`, `x if w else`) and
# untyped one-line lambdas are the codebase idiom; explicit forms add noise.
implicit-bool = false
implicit-any-lambda = false
unannotated-return = false

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
# Scientific Python and pytest expose deliberately dynamic APIs. Keep concrete
# compatibility diagnostics enabled while avoiding annotation-completeness
# noise (same posture as the pygapit project).
reportAny = false
reportExplicitAny = false
# Many helpers obviously return their constructed frame/figure; the inferred
# return type is precise enough without a redundant annotation restatement.
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnusedParameter = false
reportUnnecessaryTypeIgnoreComment = false
reportPrivateUsage = false
reportImplicitStringConcatenation = false
reportUnreachable = false
reportInvalidCast = false
reportUnknownMemberType = false
