name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install OpenCV system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libglib2.0-0

      - name: Install the project with dev tools
        run: uv sync --locked --extra dev --python 3.13

      - name: Lint
        run: uv run --locked ruff check src tests

      - name: Type check
        run: uv run --locked pyrefly check

      - name: Test
        run: uv run --locked pytest
